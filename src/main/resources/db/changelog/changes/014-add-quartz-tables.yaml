databaseChangeLog:
  - changeSet:
      id: 023-add-quartz-tables
      author: phuch
      changes:
        - createTable:
            tableName: QRTZ_JOB_DETAILS
            columns:
              - column:
                  name: SCHED_NAME
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: JOB_NAME
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: JOB_GROUP
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: DESCRIPTION
                  type: VARCHAR(250)
              - column:
                  name: JOB_CLASS_NAME
                  type: VARCHAR(250)
                  constraints:
                    nullable: false
              - column:
                  name: IS_DURABLE
                  type: VARCHAR(1)
                  constraints:
                    nullable: false
              - column:
                  name: IS_NONCONCURRENT
                  type: VARCHAR(1)
                  constraints:
                    nullable: false
              - column:
                  name: IS_UPDATE_DATA
                  type: VARCHAR(1)
                  constraints:
                    nullable: false
              - column:
                  name: REQUESTS_RECOVERY
                  type: VARCHAR(1)
                  constraints:
                    nullable: false
              - column:
                  name: JOB_DATA
                  type: BLOB
          remarks: Quartz job details table
        - addPrimaryKey:
            tableName: QRTZ_JOB_DETAILS
            columnNames: SCHED_NAME, JOB_NAME, JOB_GROUP
            constraintName: PK_QRTZ_JOB_DETAILS

  - changeSet:
      id: 024-add-quartz-triggers
      author: phuch
      changes:
        - createTable:
            tableName: QRTZ_TRIGGERS
            columns:
              - column:
                  name: SCHED_NAME
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: TRIGGER_NAME
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: TRIGGER_GROUP
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: JOB_NAME
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: JOB_GROUP
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: DESCRIPTION
                  type: VARCHAR(250)
              - column:
                  name: NEXT_FIRE_TIME
                  type: BIGINT
              - column:
                  name: PREV_FIRE_TIME
                  type: BIGINT
              - column:
                  name: PRIORITY
                  type: INT
              - column:
                  name: TRIGGER_STATE
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: TRIGGER_TYPE
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
              - column:
                  name: START_TIME
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: END_TIME
                  type: BIGINT
              - column:
                  name: CALENDAR_NAME
                  type: VARCHAR(200)
              - column:
                  name: MISFIRE_INSTR
                  type: SMALLINT
              - column:
                  name: JOB_DATA
                  type: BLOB
          remarks: Quartz triggers table
        - addPrimaryKey:
            tableName: QRTZ_TRIGGERS
            columnNames: SCHED_NAME, TRIGGER_NAME, TRIGGER_GROUP
            constraintName: PK_QRTZ_TRIGGERS
        - addForeignKeyConstraint:
            baseTableName: QRTZ_TRIGGERS
            baseColumnNames: SCHED_NAME, JOB_NAME, JOB_GROUP
            constraintName: FK_QRTZ_TRIGGERS_JOB_DETAILS
            referencedTableName: QRTZ_JOB_DETAILS
            referencedColumnNames: SCHED_NAME, JOB_NAME, JOB_GROUP


databaseChangeLog:
  - changeSet:
      id: 011-create-account-status-history
      author: phuch
      changes:
        - createTable:
            tableName: account_status_history
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_account_status_history
                    nullable: false
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_status_history_account
                    references: accounts(id)
              - column:
                  name: previous_status
                  type: VARCHAR(255)
              - column:
                  name: new_status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(255)
              - column:
                  name: changed_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: account_status_history
            indexName: idx_status_history_account_id
            columns:
              - column:
                  name: account_id
        - createIndex:
            tableName: account_status_history
            indexName: idx_status_history_changed_at
            columns:
              - column:
                  name: changed_at
      rollback:
        - dropTable:
            tableName: account_status_history

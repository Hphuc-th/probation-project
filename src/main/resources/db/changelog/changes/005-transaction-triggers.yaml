databaseChangeLog:
  - changeSet:
      id: 010-create-transaction-trigger
      author: phuch
      changes:
        - sql:
            dbms: mysql
            splitStatements: false
            endDelimiter: "\n"
            sql: >-
              CREATE TRIGGER trg_chk_transaction
              BEFORE INSERT ON transactions
              FOR EACH ROW
              BEGIN
                DECLARE v_balance DECIMAL(19,2);
                DECLARE v_limit DECIMAL(19,2);
                DECLARE v_status VARCHAR(255);

                SELECT balance, transaction_limit, status
                  INTO v_balance, v_limit, v_status
                FROM accounts
                WHERE id = NEW.account_id;

                IF v_status IS NULL THEN
                  SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'Account not found';
                END IF;

                IF v_status <> 'ACTIVE' THEN
                  SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'Account is not active';
                END IF;

                IF NEW.amount > v_limit THEN
                  SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'Amount exceeds transaction limit';
                END IF;

                IF NEW.transaction_type IN ('WITHDRAW', 'TRANSFER')
                   AND v_balance < NEW.amount + NEW.fee THEN
                  SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'Insufficient balance';
                END IF;
              END
      rollback:
        - sql:
            dbms: mysql
            sql: DROP TRIGGER IF EXISTS trg_chk_transaction
